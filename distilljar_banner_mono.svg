<svg width="100%" viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="320" fill="#000000" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1C1C1E" stroke-width="1" />
    </pattern>
    <linearGradient id="fadeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#grid)" opacity="0.4" rx="16" />
  <rect width="1000" height="320" fill="url(#fadeGlow)" rx="16" />

  <!-- Monochromatic Geometric "D" Monogram -->
  <g transform="translate(100, 60)">
    <!-- Vertical Column -->
    <rect x="0" y="0" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="0" y="40" width="34" height="34" fill="#8E8E93" rx="2" />
    <rect x="0" y="80" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="0" y="120" width="34" height="34" fill="#8E8E93" rx="2" />
    <rect x="0" y="160" width="34" height="34" fill="#FFFFFF" rx="2" />

    <!-- Top & Bottom Bars -->
    <rect x="40" y="0" width="34" height="34" fill="#8E8E93" rx="2" />
    <rect x="80" y="0" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="120" y="20" width="34" height="34" fill="#8E8E93" rx="2" />

    <!-- Right Arc Blocks -->
    <rect x="140" y="60" width="34" height="34" fill="#FFFFFF" rx="2" />
    <rect x="140" y="100" width="34" height="34" fill="#8E8E93" rx="2" />
    <rect x="120" y="140" width="34" height="34" fill="#FFFFFF" rx="2" />

    <rect x="80" y="160" width="34" height="34" fill="#8E8E93" rx="2" />
    <rect x="40" y="160" width="34" height="34" fill="#FFFFFF" rx="2" />

    <!-- Monochromatic Diamond Core -->
    <g transform="translate(60, 72) rotate(45)">
      <rect x="0" y="0" width="30" height="30" fill="#FFFFFF" rx="2" />
    </g>
  </g>

  <!-- Typography Wordmark & System Badges -->
  <g transform="translate(340, 95)">
    <!-- Main Title -->
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="-1">
      Distill<tspan fill="#8E8E93">Jar</tspan>
    </text>

    <!-- Subtitle / Positioning -->
    <text x="2" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#8E8E93" letter-spacing="4">
      LOCAL RESEARCH PAPER INTELLIGENCE &amp; MCP SERVER
    </text>

    <!-- Minimal Monochrome Feature Tags -->
    <g transform="translate(2, 120)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="112" height="24" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
      <text x="14" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#EDEDEA">100% OFFLINE</text>

      <!-- Tag 2 -->
      <rect x="120" y="0" width="124" height="24" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
      <text x="134" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#EDEDEA">ZERO TELEMETRY</text>

      <!-- Tag 3 -->
      <rect x="252" y="0" width="102" height="24" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
      <text x="266" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#EDEDEA">FAST MCP</text>

      <!-- Tag 4 -->
      <rect x="362" y="0" width="86" height="24" rx="12" fill="#1C1C1E" stroke="#2C2C2E" stroke-width="1"/>
      <text x="376" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="500" fill="#EDEDEA">TAURI v2</text>
    </g>
  </g>
</svg>
