<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistillJar | Research Distiller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
        }

        .serif {
            font-family: 'Merriweather', serif;
        }

        /* Minimal Monochrome Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #d4d4d4;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a3a3a3;
        }

        ::selection {
            background: #e5e5e5;
            color: #000000;
        }

        .prose-readable {
            max-width: 65ch;
            line-height: 1.8;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Monochrome Markdown Styling */
        .markdown-content {
            line-height: 1.6;
        }

        .markdown-content p {
            margin: 0.5em 0;
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-weight: 700;
            margin: 1em 0 0.5em 0;
            color: #000000;
        }

        .markdown-content h1 {
            font-size: 1.4em;
        }

        .markdown-content h2 {
            font-size: 1.2em;
        }

        .markdown-content h3 {
            font-size: 1.1em;
        }

        .markdown-content code {
            background: #f5f5f5;
            border: 1px solid #e5e5e5;
            padding: 0.15em 0.4em;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #000000;
        }

        .markdown-content pre {
            background: #f5f5f5;
            border: 1px solid #d4d4d4;
            border-radius: 4px;
            padding: 1em;
            overflow-x: auto;
            margin: 0.5em 0;
        }

        .markdown-content pre code {
            background: transparent;
            border: none;
            padding: 0;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 0.5em 0;
            padding-left: 2em;
        }

        .markdown-content li {
            margin: 0.25em 0;
        }

        .markdown-content blockquote {
            border-left: 3px solid #000000;
            margin: 0.5em 0;
            padding-left: 1em;
            color: #404040;
        }

        .markdown-content table {
            border-collapse: collapse;
            margin: 0.5em 0;
            width: 100%;
        }

        .markdown-content th,
        .markdown-content td {
            border: 1px solid #d4d4d4;
            padding: 0.5em;
            text-align: left;
        }

        .markdown-content th {
            background: #f5f5f5;
            font-weight: 600;
        }

        .markdown-content a {
            color: #000000;
            text-decoration: underline;
        }

        .markdown-content a:hover {
            color: #404040;
        }

        .markdown-content strong {
            font-weight: 700;
        }

        .markdown-content em {
            font-style: italic;
        }

        .markdown-content hr {
            border: none;
            border-top: 1px solid #d4d4d4;
            margin: 1em 0;
        }
    </style>
    <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

}
</script>

</head>

</html>
