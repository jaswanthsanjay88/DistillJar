[package]
name = "distilljar"
version = "1.0.3"
description = "DistillJar - Local Research Paper Intelligence & Distillation Workspace"
authors = ["DistillJar Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
